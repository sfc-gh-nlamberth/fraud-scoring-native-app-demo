definition_version: 2

entities:
  fraud_app_pkg:
    type: application package
    identifier: fraud_app_pkg
    manifest: native_app/manifest.yml
    artifacts:
      - src: native_app/setup.sql
        dest: setup.sql
      - src: native_app/README.md
        dest: README.md
      - src: native_app/streamlit
        dest: streamlit/

  fraud_app:
    type: application
    identifier: fraud_app
    from:
      target: fraud_app_pkg
    debug: true
